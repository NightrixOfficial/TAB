# =========================================================
#  Tablist - configuration
# =========================================================

# Toggled at runtime with /display lp tab enable|disable and
# /display lp name enable|disable. These starting values are only
# used the very first time the plugin runs; after that the command
# is what changes them (and they're saved back here automatically).
luckperms:
  # Show the player's LuckPerms prefix in front of their name in the tab list.
  tab-prefix: false
  # Show the player's LuckPerms prefix above their head in the world
  # (implemented via a scoreboard team prefix).
  name-prefix: false
  # Sort the tab list by LuckPerms group weight - whichever group a player
  # is in with the highest weight set (Group > Set Weight in LuckPerms)
  # counts as their highest role, and higher roles are sorted to the top.
  # This runs independently of the two toggles above (it doesn't require
  # either prefix display to be on) and needs no command - it's always on
  # unless you set this to false.
  sort-by-weight: true

# Toggled at runtime with /tablist display on|off. When true, Tablist stops
# drawing its own header/footer/ping/bold/alignment and the tab list looks
# plain/vanilla - but the luckperms settings above keep applying exactly as
# set (prefixes and weight-sorting are a separate thing from "the look").
vanilla-mode: false

# How player names are laid out in the tab list. This is MiniMessage
# format (https://docs.advntr.dev/minimessage/format.html).
# <prefix> - the LuckPerms prefix, only inserted when luckperms.tab-prefix is on
# <name>   - the player's name
# <ping>   - the colored ping component described below
format: "<prefix><white><bold><name></bold> <dark_purple>» <ping>"

# Ping is colored based on how high it is (in milliseconds).
ping:
  good-color: "<green>"
  good-max: 100
  ok-color: "<yellow>"
  ok-max: 250
  bad-color: "<red>"
  # Push the ping out to a fixed column so it lines up roughly at the same
  # spot for every player instead of trailing right after shorter/longer
  # names - i.e. "at the very right" of the entry. The "format" option
  # above still controls everything about how the prefix/name look (colors,
  # bold, the separator) - this just splices padding in before <ping>.
  align: true
  # How far from the left edge of the entry (in in-game pixels) the ping
  # should start. This is a rough approximation of Minecraft's font, not
  # measured from a real client - if the ping isn't quite lining up for
  # you, just nudge this number up or down a few pixels and reload, no
  # rebuild needed. A longer prefix/name than this column allows just
  # pushes the ping over rather than clipping anything.
  align-column: 130

# The purple-themed header/footer shown above and below the player list.
tab-list:
  footer-enabled: true
  footer: |-
    <font:effectsmp:divider><white></font>
    <gradient:#b46be0:#f0c1ff:#b46be0>✦ Effect SMP ✦</gradient> <dark_gray>|<white> <online><gray>/<max> <white>online
    <font:effectsmp:divider><white></font>

# The image banner drawn across the top of the tab list. Minecraft's tab
# list header is plain text, so this works by shipping a resource pack
# that maps the banner image onto a custom font, and the header sends the
# matching string of characters. See README.md for full setup details --
# most importantly, "public-address" below MUST be an address your
# players' clients can reach (a forwarded port / your server's public IP).
header-image:
  enabled: false
  # Whether an extra divider line is drawn just below the image banner.
  # Only relevant when enabled: true above.
  show-divider: true
  # Port the plugin's built-in tiny HTTP server listens on for serving pack.zip.
  port: 25566
  # Public address players will download the pack from, e.g. "play.effectsmp.net".
  # Leave blank to fall back to the server's configured server-ip (often blank too --
  # you will very likely need to set this yourself).
  public-address: ""
  # Whether players are forced to accept the pack to keep playing.
  required: false
  prompt: "<light_purple>Effect SMP would like to show you a custom tab list banner."
  # Plain-text fallback header shown when header-image is disabled.
  fallback-header: |-
    <font:effectsmp:divider><white></font>
    <gradient:#b46be0:#f0c1ff:#b46be0>✦ Effect SMP ✦</gradient>
    <font:effectsmp:divider><white></font>
